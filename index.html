];

let currentProduct=0;
let currentSize="M";
let currentColor="Hitam";
let quantity=1;
let currentSlide=0;
let slideTimer=null;
let productPhotoIndex=0;
let productTouchStart=0;
let currentCatalogPage=1;

function rupiah(value){
 return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(value);
}

/* PAGINATION OTOMATIS */
function productsPerPage(){
 return window.innerWidth<=600?4:12;
}

function totalPages(){
 return Math.max(1,Math.ceil(products.length/productsPerPage()));
}

function createPagination(){
 const grid=document.getElementById("productGrid");
 let pagination=document.getElementById("arelocPagination");

 if(!pagination){
  pagination=document.createElement("div");
  pagination.id="arelocPagination";
  grid.insertAdjacentElement("afterend",pagination);
 }

 pagination.style.cssText="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;padding:0 12px 45px";

 const total=totalPages();
 currentCatalogPage=Math.min(currentCatalogPage,total);

 let html=`
 <button type="button" data-page="prev" ${currentCatalogPage===1?"disabled":""}>‹</button>
 `;

 for(let i=1;i<=total;i++){
  html+=`<button type="button" data-page="${i}" ${i===currentCatalogPage?'class="active"':""}>${i}</button>`;
 }

 html+=`
 <button type="button" data-page="next" ${currentCatalogPage===total?"disabled":""}>›</button>
 `;

 pagination.innerHTML=html;

 pagination.querySelectorAll("button").forEach(button=>{
  button.style.cssText="min-width:36px;height:36px;padding:0 10px;border:1px solid #ccc;background:#fff;color:#111;font-size:12px";
  if(button.classList.contains("active")){
   button.style.background="#000";
   button.style.color="#fff";
   button.style.borderColor="#000";
  }
  if(button.disabled){
   button.style.opacity=".35";
   button.style.cursor="not-allowed";
  }
 });
}

function changeCatalogPage(page){
 const total=totalPages();

 if(page==="prev")page=currentCatalogPage-1;
 if(page==="next")page=currentCatalogPage+1;

 page=Number(page);
 if(!Number.isFinite(page))return;

 currentCatalogPage=Math.max(1,Math.min(total,page));
 renderProducts();

 const catalog=document.getElementById("katalog");
 if(catalog)window.scrollTo({top:catalog.offsetTop,behavior:"smooth"});
}

function renderProducts(){
 const grid=document.getElementById("productGrid");
 const perPage=productsPerPage();
 const start=(currentCatalogPage-1)*perPage;
 const visibleProducts=products.slice(start,start+perPage);

 grid.innerHTML=visibleProducts.map((product,index)=>{
  const realIndex=start+index;
  return `
  <article class="product-card" onclick="openProduct(${realIndex})">
   <img src="${product.images[0]}" alt="${product.name}" loading="lazy">
   <div class="product-info">
    <div class="product-name">${product.name}</div>
    <div class="product-price">${rupiah(PRICE)}</div>
    <button class="view-details" type="button" onclick="event.stopPropagation();openProduct(${realIndex})">VIEW DETAILS</button>
   </div>
  </article>
  `;
 }).join("");

 createPagination();
}

document.addEventListener("click",function(event){
 const button=event.target.closest("#arelocPagination button");
 if(!button||button.disabled)return;
 changeCatalogPage(button.dataset.page);
});

/* MENU */
function toggleMenu(){
 document.getElementById("mobileNav").classList.toggle("open");
}

/* NAVIGASI HALAMAN */
function showPage(id){
 document.querySelectorAll(".page").forEach(page=>page.classList.remove("active"));
 const target=document.getElementById(id);
 if(target)target.classList.add("active");

 document.getElementById("mobileNav").classList.remove("open");
 window.scrollTo({top:0,behavior:"smooth"});

 if(id!=="detail")history.replaceState({page:id},"","#"+id);
}

/* DETAIL PRODUK */
function openProduct(index){
 currentProduct=index;
 currentSize="M";
 currentColor="Hitam";
 quantity=1;

 document.getElementById("detailName").textContent=products[index].name;
 document.getElementById("detailPrice").textContent=rupiah(PRICE);
 document.getElementById("quantity").textContent=quantity;

 document.querySelectorAll(".size-options button").forEach(button=>{
  button.classList.toggle("selected",button.textContent===currentSize);
 });

 document.querySelectorAll(".color-options button").forEach(button=>{
  button.classList.toggle("selected",button.textContent.trim().toLowerCase()===currentColor.toLowerCase());
 });

 renderGallery();
 showPage("detail");
 history.pushState({page:"detail",product:index},"","#produk-"+(index+1));
}

function renderGallery(){
 const product=products[currentProduct];
 productPhotoIndex=0;

 document.getElementById("productSlides").innerHTML=product.images.map((url,index)=>
  `<img src="${url}" alt="${product.name} foto ${index+1}" draggable="false">`
 ).join("");

 document.getElementById("productDots").innerHTML=product.images.map((url,index)=>
  `<button type="button" class="product-dot ${index===0?"active":""}" onclick="goProductPhoto(${index})" aria-label="Foto ${index+1}"></button>`
 ).join("");

 updateProductGallery();
}

function updateProductGallery(){
 document.getElementById("productSlides").style.transform="translateX(-"+(productPhotoIndex*100)+"%)";

 document.querySelectorAll(".product-dot").forEach((dot,index)=>{
  dot.classList.toggle("active",index===productPhotoIndex);
 });
}

function goProductPhoto(index){
 const total=products[currentProduct].images.length;
 productPhotoIndex=(index+total)%total;
 updateProductGallery();
}

function chooseColor(color){
 currentColor=color;

 document.querySelectorAll(".color-options button").forEach(button=>{
  button.classList.toggle("selected",button.textContent.trim().toLowerCase()===color.toLowerCase());
 });
}

function chooseSize(size){
 currentSize=size;

 document.querySelectorAll(".size-options button").forEach(button=>{
  button.classList.toggle("selected",button.textContent===size);
 });
}

function changeQty(amount){
 quantity=Math.max(1,Math.min(20,quantity+amount));
 document.getElementById("quantity").textContent=quantity;
}

function orderWhatsApp(){
 const product=products[currentProduct];
 const total=PRICE*quantity;

 const message=
 `Halo ARELOC, saya ingin memesan produk:\n\n`+
 `Produk: ${product.name}\n`+
 `Harga: ${rupiah(PRICE)}\n`+
 `Warna: ${currentColor}\n`+
 `Ukuran: ${currentSize}\n`+
 `Jumlah: ${quantity}\n`+
 `Total: ${rupiah(total)}\n\n`+
 `Mohon informasi stok dan cara pengiriman. Terima kasih.`;

 window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(message),"_blank");
}

/* GESER GALERI PRODUK */
const productSlider=document.getElementById("productSlider");
productSlider.addEventListener("touchstart",event=>{
 productTouchStart=event.touches[0].clientX;
},{passive:true});

productSlider.addEventListener("touchend",event=>{
 const distance=event.changedTouches[0].clientX-productTouchStart;
 if(Math.abs(distance)>40)goProductPhoto(productPhotoIndex+(distance<0?1:-1));
},{passive:true});

/* SLIDER HEADER */
function updateSlide(){
 document.getElementById("arelocSlides").style.transform="translateX(-"+(currentSlide*100)+"%)";

 document.querySelectorAll(".slider-dot").forEach((dot,index)=>{
  dot.classList.toggle("active",index===currentSlide);
 });
}

function goSlide(index){
 currentSlide=(index+5)%5;
 updateSlide();
 restartSlideTimer();
}

function moveSlide(direction){
 goSlide(currentSlide+direction);
}

function restartSlideTimer(){
 clearInterval(slideTimer);
 slideTimer=setInterval(()=>{
  currentSlide=(currentSlide+1)%5;
  updateSlide();
 },4000);
}

const headerSlider=document.getElementById("arelocSlider");
let headerTouchStart=0;

headerSlider.addEventListener("touchstart",event=>{
 headerTouchStart=event.touches[0].clientX;
},{passive:true});

headerSlider.addEventListener("touchend",event=>{
 const distance=event.changedTouches[0].clientX-headerTouchStart;
 if(Math.abs(distance)>45)moveSlide(distance<0?1:-1);
},{passive:true});

/* PERBARUI JUMLAH PRODUK PER HALAMAN SAAT LAYAR BERUBAH */
let lastPerPage=productsPerPage();

window.addEventListener("resize",()=>{
 const newPerPage=productsPerPage();

 if(newPerPage!==lastPerPage){
  lastPerPage=newPerPage;
  currentCatalogPage=1;
  renderProducts();
 }
});

/* JALANKAN TOKO */
restartSlideTimer();
renderProducts();
</script>
